<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oil paint</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #1c1512; overflow: hidden; }
      #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #d9b98a; font: 15px/1.4 Georgia, serif; letter-spacing: 0.08em; }
      #hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); color: #f3e3c3; font: 14px/1.4 Georgia, serif; letter-spacing: 0.04em;
        background: rgba(28, 20, 18, 0.55); padding: 8px 16px; border-radius: 3px; transition: opacity 2s; pointer-events: none; white-space: nowrap; }
      #hint.faded { opacity: 0; }
      #hint.off { display: none; }
      html[data-scene='aurora'] body { background: #061219; }
      html[data-scene='aurora'] #loading { color: #9fd8c4; }
      #scenes { position: fixed; left: 18px; bottom: 18px; display: flex; gap: 6px; }
      #langs { position: fixed; right: 18px; top: 18px; display: flex; gap: 6px; }
      #scenes button, #langs button { font: 13px/1 Georgia, serif; letter-spacing: 0.04em; color: #f3e3c3; background: rgba(28, 20, 18, 0.55);
        border: 1px solid rgba(243, 227, 195, 0.25); padding: 8px 12px; border-radius: 3px; cursor: pointer; }
      #langs button { padding: 6px 9px; }
      #langs button[hidden] { display: none; }
      #scenes button.on, #langs button.on { background: rgba(243, 227, 195, 0.9); color: #1c1512; cursor: default; }
      #hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center;
        pointer-events: none; }
      #hud[hidden] { display: none; }
      #compass { display: block; height: 30px; background: linear-gradient(90deg, transparent, rgba(6, 18, 25, 0.5) 18%, rgba(6, 18, 25, 0.5) 82%, transparent); }
      #compass-label { margin-top: 3px; color: #f3e3c3; font: 13px/1.3 Georgia, serif; letter-spacing: 0.08em; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
      #banner { position: fixed; left: 50%; top: 21%; transform: translateX(-50%); max-width: calc(100vw - 32px); text-align: center; color: #f3e3c3;
        font: italic 22px/1.4 Georgia, serif; letter-spacing: 0.1em; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85); opacity: 0; transition: opacity 1.4s;
        pointer-events: none; }
      #banner.on { opacity: 1; }
      #life { position: fixed; left: 18px; top: 18px; width: min(200px, calc(100vw - 36px)); height: 9px; background: rgba(6, 18, 25, 0.55);
        border: 1px solid rgba(243, 227, 195, 0.25); border-radius: 2px; pointer-events: none; overflow: hidden; }
      #life[hidden] { display: none; }
      #life .loss, #life .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
      #life .loss { background: rgba(243, 227, 195, 0.55); transition: width 0.9s 0.35s; }
      #life .fill { background: linear-gradient(180deg, #f2c27e, #c98b48); transition: width 0.12s, background 0.6s; }
      #life.low .fill { background: linear-gradient(180deg, #e0745a, #a33f2f); }
      #foe { position: fixed; left: 0; top: 0; width: 64px; height: 5px; background: rgba(6, 18, 25, 0.6); border: 1px solid rgba(243, 227, 195, 0.3);
        border-radius: 2px; pointer-events: none; overflow: hidden; }
      #foe[hidden] { display: none; }
      #foe .fill { height: 100%; width: 100%; background: #dfe9ef; transition: width 0.15s; }
      #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(150, 30, 25, 0.55) 100%); }
      #hurt.on { animation: hurt 0.9s ease-out; }
      @keyframes hurt { from { opacity: 1; } to { opacity: 0; } }
      #veil { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; background: rgba(4, 10, 14, 0.88);
        color: #f3e3c3; opacity: 0; transition: opacity 1.2s; pointer-events: none; padding: 0 16px; }
      #veil.on { opacity: 1; }
      #veil .title { font: italic 34px/1.3 Georgia, serif; letter-spacing: 0.14em; }
      #veil .sub { font: 14px/1.4 Georgia, serif; letter-spacing: 0.08em; color: rgba(243, 227, 195, 0.7); }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="loading">Mixing paint</div>
    <div id="scenes"><button data-scene="aurora" tabindex="-1">Aurora</button><button data-scene="autumn" tabindex="-1">Autumn wood</button></div>
    <div id="langs"><button data-sound hidden tabindex="-1"></button><button data-lang="tr" tabindex="-1">TR</button><button data-lang="en" tabindex="-1">EN</button></div>
    <div id="hud" hidden><canvas id="compass"></canvas><div id="compass-label"></div></div>
    <div id="banner"></div>
    <div id="life" hidden><div class="loss"></div><div class="fill"></div></div>
    <div id="foe" hidden><div class="fill"></div></div>
    <div id="hurt"></div>
    <div id="veil"><div class="title"></div><div class="sub"></div></div>
    <div id="hint">Click to look · WASD move · Shift sprint · Space jump · wheel to step back</div>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
